[package]
name = "gaboemru"
version = "0.0.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
name = "gaboemru"
path = "src/lib.rs"

[[bin]]
name = "gaboemru"
path = "src/main.rs"

[dependencies]
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[features]
test-utils = []

[dev-dependencies]
gaboemru = { path = ".", features = ["test-utils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
